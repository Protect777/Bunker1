name: Build Bunker Online PRO APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Flutter Android Project
        run: |
          if [ -f "main.dart" ]; then
            cp main.dart /tmp/bunker_main.dart
          elif [ -f "lib/main.dart" ]; then
            cp lib/main.dart /tmp/bunker_main.dart
          else
            echo "Файл main.dart не найден!" && exit 1
          fi

          flutter create --platforms=android --org com.bunker.online --project-name bunker_online_pro .
          cp /tmp/bunker_main.dart lib/main.dart

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$MANIFEST"
          fi
          sed -i 's/android:label="[^"]*"/android:label="Бункер Онлайн PRO"/' "$MANIFEST"

      - name: Build Native Release APK
        run: flutter build apk --release

      - name: Upload APK to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bunker-online-pro-native-apk
          path: build/app/outputs/flutter-apk/app-release.apk
