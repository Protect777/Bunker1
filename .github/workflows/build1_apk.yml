name: Build Bunker Online PRO (Android APK + iPhone IPA)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build Android APK
        run: |
          cp main.dart /tmp/bunker_main.dart 2>/dev/null || cp lib/main.dart /tmp/bunker_main.dart
          flutter create --platforms=android --org com.bunker.online --project-name bunker_online_pro .
          flutter pub add web_socket_channel
          cp /tmp/bunker_main.dart lib/main.dart
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$MANIFEST"
          fi
          sed -i 's/android:label="[^"]*"/android:label="Бункер Онлайн PRO"/' "$MANIFEST"
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: bunker-online-pro-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-iphone:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - name: Build iPhone IPA
        run: |
          cp main.dart /tmp/bunker_main.dart 2>/dev/null || cp lib/main.dart /tmp/bunker_main.dart
          flutter create --platforms=ios --org com.bunker.online --project-name bunker_online_pro .
          flutter pub add web_socket_channel
          cp /tmp/bunker_main.dart lib/main.dart
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -q bunker-online-pro-iphone.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: bunker-online-pro-iphone-ipa
          path: bunker-online-pro-iphone.ipa
